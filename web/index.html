<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>stx-monitor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <a class="brand" href="#/overview">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true" fill="none" stroke="#3FD8FF"><circle cx="18" cy="18" r="16" stroke-width="1" stroke-opacity=".6"/><circle cx="18" cy="18" r="11" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="18" cy="18" r="4" fill="#3FD8FF" stroke="none"/></svg>
      <span><span class="brand-name" data-bind="hostname">stx-server</span><br><span class="brand-sub" data-bind="machine">Connecting…</span></span>
    </a>
    <ul id="rail-links"></ul>
    <div class="rail-foot">
      <span class="live" data-bind="live"><span class="live-dot" aria-hidden="true"></span><span data-bind="live-text">Connecting</span></span>
      <span data-bind="uptime"></span>
      <span class="foot" data-bind="build"></span>
      <div class="rail-user"><span>Signed in as <span data-bind="user"></span></span><button type="button" class="link-btn" data-action="sign-out">Sign out</button></div>
    </div>
  </nav>

  <header class="topbar">
    <a class="brand" href="#/overview">
      <svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true" fill="none" stroke="#3FD8FF"><circle cx="18" cy="18" r="16" stroke-width="1" stroke-opacity=".6"/><circle cx="18" cy="18" r="11" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="18" cy="18" r="4" fill="#3FD8FF" stroke="none"/></svg>
      <span class="brand-name" data-bind="hostname">stx-server</span>
    </a>
    <span class="live" data-bind="live"><span class="live-dot" aria-hidden="true"></span><span data-bind="live-text">Connecting</span></span>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections" id="tab-links"></nav>
</div>
<noscript><p style="padding:24px">stx-monitor needs JavaScript to show live data.</p></noscript>
</body>
</html>
