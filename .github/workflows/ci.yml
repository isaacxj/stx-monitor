name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Check the web UI parses
        run: node --check web/app.js && node --check web/demo.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t stx-monitor:ci .
      - name: Smoke test
        run: |
          docker run -d --name stx -p 8090:8090 -e DOCKER_HOST=none stx-monitor:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/api/overview > /dev/null
          curl -fsS http://127.0.0.1:8090/ | grep -q "<title>stx-monitor</title>"
      - name: Container logs
        if: always()
        run: docker logs stx || true
